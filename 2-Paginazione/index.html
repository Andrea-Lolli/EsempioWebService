<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Controller API Biblioteca - Paginazione</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background-color: #f8f9fa; }
        .controlli { margin-bottom: 20px; padding: 15px; background: #f4f4f4; border-radius: 8px; border: 1px solid #dee2e6; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; }
        .btn-all { background: #28a745; }
        .btn-recent { background: #007bff; }
        .btn-nav { background: #6c757d; padding: 6px 12px; margin-top: 10px; }
        .btn-nav:disabled { background: #ced4da; cursor: not-allowed; }
        .libro { background: #fff; border: 1px solid #ddd; margin: 10px 0; padding: 10px; border-left: 5px solid #28a745; border-radius: 4px; }
        .paginazione-container { margin-top: 15px; padding-top: 10px; border-top: 1px solid #dee2e6; }
        .info-pagine { margin-right: 15px; font-size: 0.9em; color: #495057; }
    </style>
</head>
<body>

    <h1>Gestione Biblioteca (RESTful API con Paginazione)</h1>
    
    <div class="controlli">
        <button class="btn-all" onclick="cambiaPagina(1)">Mostra Catalogo Paginato</button>
        <button class="btn-recent" onclick="mostraRecenti()">Libri post-2000 (Senza paginazione)</button>
    </div>

    <div id="display">
        <p>Seleziona un'azione per caricare i dati dal Web Service.</p>
    </div>

    <div id="controlli-pagine" class="paginazione-container" style="display: none;"></div>

    <script>
        let paginaAttuale = 1;

        // FUNZIONE CON PAGINAZIONE (Per la rotta /tutti + query string)
        async function cambiaPagina(nuovaPagina) {
            paginaAttuale = nuovaPagina;
            const display = document.getElementById('display');
            const controlliPagine = document.getElementById('controlli-pagine');
            display.innerHTML = `<em>Caricamento pagina ${paginaAttuale}...</em>`;

            try {
                // Costruiamo l'URL combinando la rotta REST e il parametro di paginazione
                const url = `api.php/tutti?pagina=${paginaAttuale}`;
                const risposta = await fetch(url);
                const rispostaOggetto = await risposta.json();
                
                const elencoLibri = rispostaOggetto.data;
                const meta = rispostaOggetto.metadati;

                // Rendering dei libri della pagina corrente
                display.innerHTML = `<h3>Risultati Catalogo - Pagina ${meta.pagina_corrente} di ${meta.totale_pagine}</h3>`;
                elencoLibri.forEach(libro => {
                    display.innerHTML += `
                        <div class="libro">
                            <strong>[ID #${libro.id}] ${libro.titolo}</strong> (${libro.anno})<br>
                            <small>Autore: ${libro.autore}</small>
                        </div>
                    `;
                });

                // Generazione dinamica dei bottoni di navigazione delle pagine
                controlliPagine.style.display = "block";
                controlliPagine.innerHTML = `
                    <span class="info-pagine">Elementi totali: <b>${meta.totale_elementi}</b></span>
                    <button class="btn-nav" ${meta.pagina_corrente === 1 ? 'disabled' : ''} onclick="cambiaPagina(${meta.pagina_corrente - 1})">« Precedente</button>
                    <span class="info-pagine">Pagina <b>${meta.pagina_corrente}</b> / ${meta.totale_pagine}</span>
                    <button class="btn-nav" ${meta.pagina_corrente === meta.totale_pagine ? 'disabled' : ''} onclick="cambiaPagina(${meta.pagina_corrente + 1})">Successiva »</button>
                `;

            } catch (err) {
                display.innerHTML = "<b style='color:red;'>Errore durante la paginazione.</b>";
                controlliPagine.style.display = "none";
                console.error(err);
            }
        }

        // FUNZIONE SPECIFICA PER I LIBRI RECENTI (/recenti)
        async function mostraRecenti() {
            // Nascondiamo i controlli della paginazione poiché questa rotta non li prevede
            document.getElementById('controlli-pagine').style.display = "none";
            
            const display = document.getElementById('display');
            display.innerHTML = "<em>Interrogando il controller per i libri recenti...</em>";

            try {
                const url = 'api.php/recenti';
                const risposta = await fetch(url);
                const dati = await risposta.json();

                display.innerHTML = `<h3>Risultati per: /recenti (Libri post-2000)</h3>`;
                dati.forEach(libro => {
                    display.innerHTML += `
                        <div class="libro" style="border-left-color: #007bff;">
                            <strong>${libro.titolo}</strong> (${libro.anno})<br>
                            <small>Autore: ${libro.autore}</small>
                        </div>
                    `;
                });
            } catch (err) {
                display.innerHTML = "<b style='color:red;'>Errore nella chiamata al Web Service per i libri recenti.</b>";
                console.error(err);
            }
        }
    </script>
</body>
</html>
